<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        border: 1px solid green;
        height: 300px;
        display: flex;
        /* display:inline-flex; */

        /* flex-direction: 축의 방향을 정한다; */

        /* 메인축의 기본값: 왼쪽에서 오른쪽으로 */
        /* flex-direction: row; */

        /* 횡 축 뒤집기(오른쪽에서 왼쪽으로) */
        /* flex-direction:row-reverse; */

        /* 메인축을 위에서 아래로 */
        /* flex-direction: column; */

        /* 메인축을 아래에서 위로 */
        /* flex-direction: column-reverse; */



        /* 기본값 / 한 줄에 모든 item을 표시하기 위해 노력함 */
        /* flex-wrap: nowrap; */
        /* 넘치는 경우 다음 줄로 inline-block이랑 비슷 */
        /* cross축 start에서 end로 */
        /* flex-wrap: wrap; */

        /* cross축 end에서 start로 */
        /* flex-wrap:wrap-reverse; */


        /* justify-content : 가로선 상 정렬 */

        /* 기본값 */
        /* justify-content: flex-start; */
        /* 축 기준 역정렬 */
        /* justify-content: flex-end; */
        /* 중앙 정렬 / 중요! 세로로 축을 만들면 세로 중앙 정렬이 된다  */
        /* flex-direction: column; */
        /* justify-content: center; */

        /* 남은 여백을 균등하게 간격으로 집어넣는다. */
        /* justify-content: space-between; */
        /* 남은 여백 사이에 콘텐츠를 집어넣는다. */
        /* justify-content: space-around; */
        /* 남은 여백을 공평하게 집어넣는다. */
        /* justify-content: space-evenly; */

        /* 한 줄에 대한 cross축이 대상 */
        /* 기본값, 부모 크기 만큼 cross축 방향으로 쭉 */
        /* align-items:stretch; */
        /* cross 축 start방향 */
        /* align-items:flex-start;
        align-items:flex-end;
        align-items:center; */
        
        /* 여러 줄에 대한 cross축이 대상 */
        /* flex-wrap: wrap; */
        /* align-content: stretch; */
        
        /* 기본값 각 줄의 높이를 꽉 채운 상태 */
        /* align-content:flex-start; */
        /* align-content:flex-end; */
        /* align-content:center; */
    }

        

    .container .item {
        border: 1px solid red;
        background-color: brown;
        color: white;

        width:100px;
        /* item의 너비를 px,%단위로 지정, 기본값은 auto이다 */
        flex-basis: 400px;
    }
</style>

<body>
    <div class="container">
        <!-- align-self 개별 정렬 우선시 -->
        <div class="item" style="align-self: end;">1</div>
        <!-- 중요! html내용 순서와 상관없이 보여주는 순서를 강제로 바꾼다 -->
        <div class="item" style="order:2;">2</div>
        <div class="item" style="order:1;">3</div>
        <!-- shrink: 본래 균등하게 줄어들어야 할 크기를 shrink 비율만큼 줄어들게 한다. -->
        <div class="item" style="flex-grow:1; flex-shrink: 4;">4</div>
        <!-- grow: 남는 공간을 나눠서 N/N만큼 채운다  -->
        <div class="item" style="flex-grow:3;">5</div>
    </div>
</body>

</html>
