<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform</title>
    <style>
        .box {
            border: 1px solid red;
            height: 100px;
            width: 100px;
            background-color: green;
            color: white;
            margin: 10px;
        }

        .translate:hover {
            /* 픽셀 단위 꼭 입력하기!
            relative와 다르게 %단위의 이동이 가능해서 편하다!
            */
            transform: translate(50%, 20px);
        }
        /* 크기 조정 */
        .scale{
            transform: scale(1.3);
        }
        /* 돌리기 */
        .rotate{
            transform: rotate(30deg);
        }
        /* 비틀기 */
        .skew{
            transform: skew(10deg, -30deg);
        }
        /* 짬탕 */
        .total{
            transform:translate(50%, 20px) scale(1.3) rotate(30deg);
        }
        /* 중앙정렬 콤보 */
        .parent {
            width:40%;
            height: 30vh;
            border: 1px solid red;
            position:relative;
        }
        .child {
            width:100px;
            height: 100px;
            border: 1px solid rgb(0, 26, 255);

            transform:translate(-50%,-50%);

            position:absolute;
            top:50%;
            left:50%;  
            /* 중앙정렬 콤보 */ 
        }

        /* 부드러운 효과 주기 */
        .box{
            /* transition: all 0.5s; */
            transition: width 0.5s;
        }

        .box:hover{
            width: 200px;
            background-color:red;
            border-radius:20px;

            /* transition: all 0.5s;  */
        /* 부드럽게 */
        }

        .box2{
            border : 1px solid red;
            height: 50vh;
            
            /* 그라데이션 넣기
            각도, 색상(색 / 거리), 색상(색 / 거리)
            */

            background-image: linear-gradient(135deg, red 20% 50%, green 80%, blue 100% );
        }

    </style>
</head>

<body>
    <div class="box"> 비교 </div>
    <div class="box translate"> translate </div>
    <div class="box scale"> scale</div>
    <div class="box rotate"> rotate</div>
    <div class="box skew"> rotate</div>
    <div class="box total"> total</div>

    <div class="parent">
        <div class="child"></div>
    </div>
    
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>

    <div class="box box2"></div>
</body>

</html>
