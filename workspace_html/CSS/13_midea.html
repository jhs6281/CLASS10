<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            border: 1px solid blue;
            list-style: none;
            padding-left: 0px;

        }

        li {
            border: 1px solid red;
            width: 100px;
            display: inline-block;
            text-align: center;
        }

        span {
            display: none;
        }

        /* 300px ~ 950px ~ 1440px이상  */

        @media screen and (max-width: 600px) {
            /* 최대 600까지 적용한다 */
            /* 새로운 css */
            span {
                display: inline;
            }
            ul {
                display: none;
            }
            li{
                display: block;
                width: 100%;
            }
            span:hover + ul{
                display: block;
            }
        }
    </style>
</head>

<body>
    <span>메뉴열기</span>
    <ul>
        <li>메일</li>
        <li>블로그</li>
        <li>웹툰</li>
        <li>카페</li>
    </ul>
</body>

</html>
