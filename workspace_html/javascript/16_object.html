<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const url = '15_event_form.html'

        const name = 'open 연습'
        let option = 'width=800,height=600'
        window.open(url, name, option)

        console.log(location.href)
        console.log(navigator.userAgent)

        window.onload = () => {
            btn = document.querySelector('#btn1')
            btn.addEventListener('click', function () {
                location.href = 'http://naver.com'
            })
            document.querySelector('#btn2')
                .addEventListener('click', function () {
                    location.reload()
                })
            document.querySelector('#btn3')
                .addEventListener('click', function () {
                    history.go(-1)
                    // 많이 안쓴다.
                    // href로 지정 이동 하는 것이 보편적
                })
        }


    </script>
</head>

<body>
    <button type="button" id="btn1">네이버로 이동</button>
    <button type="button" id="btn2">새로고침</button>
    <button type="button" id="btn3">뒤로가기</button>
    <input type="file">

    <!-- * 카카오맵 - 지도퍼가기 -->
    <!-- 1. 지도 노드 -->
    <div id="daumRoughmapContainer1770793530325" class="root_daum_roughmap root_daum_roughmap_landing"></div>

    <!--
	2. 설치 스크립트
	* 지도 퍼가기 서비스를 2개 이상 넣을 경우, 설치 스크립트는 하나만 삽입합니다.
-->
    <script charset="UTF-8" class="daum_roughmap_loader_script"
        src="https://ssl.daumcdn.net/dmaps/map_js_init/roughmapLoader.js"></script>

    <!-- 3. 실행 스크립트 -->
    <script charset="UTF-8">
        new daum.roughmap.Lander({
            "timestamp": "1770793530325",
            "key": "hk26g4p275j",
            "mapWidth": "640",
            "mapHeight": "360"
        }).render();
    </script>
</body>

</html>
