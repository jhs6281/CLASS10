<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 배열이란 ? 변수를 나열하여 저장한 것

        //배열 선언 방법 1
        const arr1 = []; // 대괄호 사용

        // 배열 선언 방법 2
        const arr2 = new Array();

        //값을 미리 알고 있을 때
        const arr3 = [1, 2, "글씨", 3.14];
        const arr4 = new Array (1, 2, "글씨", 3.14)

        console.log("arr3[0]: ", arr3[0])
        arr3[0] = 10; // const 값 변경 가능
        // -> 스택영역의 값을 바꿨기 때문
        // 힙 영역의 주소값은 변경할 수 없다

        console.log("arr3[0]: ", arr3[0])

        console.log('arr3 : , ' , arr3) // 배열 그대로
        console.log('arr3 : +  ' + arr3) // 문자열 더하기

        //JAVA SCRIPT에서의 객체 : prototype

        arr3[10] = 100
        console.log('arr3[10] : ', arr3)

        arr3["age"] = 20
        console.log('arr3[10] : ', arr3)

        // 개발자 도구 개념 알기 : 인터프린팅 -> 얕은 복사 -> 출력

        console.log('arr.length : ', arr4.length )

        for( let i=0; i<arr4.legnth; i++ ){
            console.log(arr4[i])
        }

        const 중식 = ['탕슉', '짬뽕', '깐쇼새우', '볶음밥']
        const 양식 = ['파스타', '돈까스', '스테이크']
        const 일식 = ['초밥', '카라아게', '오꼬노미야끼', '라멘', '타코야끼']
        const 음식 = [중식, 양식, 일식]

        for(let i = 0; i<음식.length; i++){
            for(let j=0; j<음식[i].length; j++){
                console.log(음식[i][j]);
            }
        }

        //배열의 메소드 사용하기
        let arr = [1,2,3,4]

        // 맨 마지막에 하나 추가
        arr.push(5)

        // java ArrayList의 add()와 같은 개념
        // 맨 뒤에 추가
        console.log(arr)

        // 맨 앞에 추가
        arr.unshift(0)
        console.log(arr)

        // 맨 처음것 하나 빼서 돌려주기
        // 원본 바뀜
        let shift = arr.shift()
        console.log('shift', shift)
        console.log(arr)

        // 맨 마지막 것 한 빼서 돌려주기
        let pop = arr.pop()
        console.log('pop' , pop)
        console.log(arr)

        // stack 과 queue
        // stack
        //      나중의 것을 처음에 사용하는 것 (후입선출)
        //      Last In First Out(LIFO)
        // queue
        //      처음 것을 처음에 사용하는 것 (선입선출)
        //      First In First Out(FIFO)

        // 배열 뒤집기
        arr.reverse();
        console.log(arr);
        
        arr = [7,4,2,3,6,5]
        const sort = arr.sort()
        console.log(arr)
        console.log('sort: ', sort)

        //함수를 뒤집는 방식
        sort.reverse()
        
        // chaining 체이닝 체인방식 체인
        arr.sort().reverse()

        // splice ( 시작 index, count )
        /*
            원본에서 잘라서 돌려준다 (원본 바꿈)
            시작 index가 음수면 뒤에서부터 따진다
            전달인자가 시작 index하나면 끝까지
        */
        arr = [0,1,2,3,4,5,6]
        let sp = arr.splice(2, 3) //2번째부터 3개 자른다
        console.log(arr)
        console.log('sp', sp)
        
        //초기화
        // count가 커도 에러 없이 끝까지만
        arr = [0,1,2,3,4,5,6]
        sp = arr.splice(-4, 2) //뒤에서 4번째부터 2개 자른다
        console.log(arr)
        console.log('sp', sp)

        arr = [0,1,2,3,4,5,6]
        // 자를 건 자르고 그 자리에 새 값을 추가
        arr.splice(1,2,10,20,30,40)
        console.log(arr)

        arr=[0,1,2,3,4,5,6]
        // 중간에 삽입(자르지 않고)
        arr.splice(1 ,0, 100)
        console.log(arr)

        // 시간에서 시 표기할 때
        // 12시는 12 / 7시는 07
        // 012, 07 이렇게 0 붙이고, 뒤에서 두자리 잘라서 출력
        // (if문 짧아짐)

        let hour = 7
        let str_hour = '0'+hour
        let h = str_hour.slice(-2)
        console.log('h', h)

        ////////////////////////////////

        // join
        // 원본 안바뀜
        // 배열을 모두 글씨로 바꿔준다
        // 전달인자가 없는 경우 , 적어준다
        arr = [0,1,2,3,4,5,6]
        let str = arr.join()
        console.log('str', str)
        str = arr.join('') //공백 없이 출력. '넣고 싶은 내용'
        console.log('str', str)

        // split
        // 문자를 다시 배열로 바꿔준다
        let arr6 =str.split('') // '구분자 내용' 입력
        console.log(arr6)

        // join / split 은 세트로 사용된다
        let str6 = arr.join('😎') //사이에 넣기
        console.log(str6)
        let splt = str6.split('😎') // 대상 기준으로 자르기 (이후 배열로 저장)
        console.log(splt)

        let arr7 = [ 1,2,3,4]
        let arr8 = arr6.concat(arr7)
        console.log(arr8)

        console.log(arr8.toString()) // 배열 모양의 문자열
        console.log(''+arr8)

        let arr9 = [2, 65, 34, 3, 2, 67]
        // arr9.sort() // 오름차순
        // arr9.sort(function(x, y, a, b, c){
        //     console.log(x, y, a, b, c)
        // })
        arr9.sort(function(x,y){
            return y - x
        })
        console.log(arr9)

        // arr9.sort((x, y) => y - x))

        
    </script>
