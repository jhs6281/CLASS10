<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        // 함수
        // function 키워드로 함수 선언
        // 전달인자에는 타입을 적지 않는다

        //필수 양식
        // function 함수의 변수명(){}

        function plus(x, y) {
            console.log('x', x)
            console.log('y', y)

            const z = x + y;
            return z;
        }

        const z = plus(2, 3)
        console.log('z : ', z)

        // 전달인자 2,3 

        const z2 = plus(2, plus(2, 3)) // 함수 안에 함수(리턴 값 적용)
        console.log('z2 : ', z2)

        // 중요! 전달인자 테스트!
        console.log('/////////////////////////////')
        let a = plus(); // 일부러 전달인자 안 줬을 때
        console.log('a : ', a)
        // x : undefinded / y : undefinded / a : NaN

        console.log('~~~~~~~~~~~~~~~~~~~~~~~~~~~')
        a = plus(4) // 전달인자 1개만 줬을 때
        console.log('a : ', a)
        // x : 4 / y : undefinded / a : NaN

        a = plus(10, 20, 30, 40) // 전달인자를 2개 이상 줬을 때
        console.log('a : ', a)
        // x : 10 / y : 20 / a : 30
        // 맨 왼쪽의 정수 두 개만 받아서 사용한다.


        function plus2(x, y) {
            // if(x == undefinded){
            //     x = 0
            // }
            // if(y == undefinded){
            //     y = 0
            // }

            // 전달인자 안 줬을 때를 대비하여 방어 코드 작성
            if (!x) {//js에서 false의 정의를 이용하여 반환
                console.log('참', x)
                //x가 거짓일 때
            }
            if (!y) y = 0; // 위와 같은 뜻

            return x + y
        }
        console.log(plus2())

        function plus3(x = 0, y = 0) {
            console.log('x', x)
            console.log('y', y)
            return x + y;
        }
        console.log(plus3(2))

        let c = [1, 2, 3]
        function fn_arr(b) {
            console.log('b type: ', typeof b)
            console.log('b index : ', b[0])
        }
        fn_arr(c)

        // spread 연산자
        // 전달인자의 경우 모든 전달인자를 배열로 관리
        console.log(1, 2, 3, 4, 5)
        function log(...obj) {
            console.log(typeof obj)
            console.log(obj[0])
        }
        log(1, 2, 3, 4, 5)
        log(...c)               //이거랑
        log(c[0], c[1], c[2])   //이거랑 같음
        log(1, 2, 3)            //얘도 같음

        function print() {
            console.log("print 실행")
        }
        print()
        // 여기서 실행문 썼음
        function print() {
            console.log("두번째 print 실행")
        }
        // 호이스팅 + 오버로딩 되어서 이게 실행됨(?)
        print()
        // 덮어 써짐. 
        // 해결 방법: 함수는 같은 이름으로 작성 X

        let p = print;
        console.log(typeof p)
        console.log(typeof print)
        let l = console.log
        l('이걸 담네')

        // 오버로딩 
        // 덮어 쓰기 때문에 지원하지 않음.
        function over() {

        }
        function over(x) {

        }

        // 익명함수
        let no_name = function () {
            console.log('익명함수')
        }
        //no_name()

        // function no_name(){
        //     console.log('익명함수')
        // }

        //no_name() // 2에 집어넣기
        // let no_name2 = no_name;

        // function test(a){
        //     a()
        // }
        // test(no_name)

        // test(function () {
        //     console.log('익명함수우우')
        // })
        // 이름없는 함수
        // 함수를 변수에 담아서 호출 가능

        // 콜백 함수


        function test2(cb) {
            console.log(typeof cb)
            //cb()
            if (typeof cb == 'function') {
                cb()
            } else {
                console.log('함수가 아닙니다')
            }
        }
        test2(function () { })
        test2(3)

        // setTimeout(함수, 시간ms)

        setTimeout(no_name, 2000)

        setTimeout(function () {
            console.log('익명함수우우')
        }, 3000)

        let idx = setTimeout(function () {
            console.log('익명함수4')
        },
            1000 * 10
        )
        console.log('idx : ', idx)
        clearTimeout(idx) // setTimeout 취소

        
        setTimeout(
            function(x,y){
                console.log(x, y)
            },
            1000, 1, 2
        )

        //setInterval
        let idx2 = setInterval(function(){
            console.log('setInterval 실행')
        }, 1000*2)

        setTimeout(function(){
            clearInterval(idx2)
        }, 1000*5)

        function fn(){
            console.log('fn 실행')
            return 1
        }
        let fn2 = fn;

        eval(str);
    </script>
