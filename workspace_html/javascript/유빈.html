<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultimate Roguelike Shooter</title>
<style>
body { margin:0; background:black; overflow:hidden; }
canvas { display:block; margin:0 auto; background:#111; }
#upgradeUI {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:#222;
    padding:20px;
    display:none;
    border:2px solid white;
}
button { margin:10px; padding:10px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="upgradeUI"></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const upgradeUI = document.getElementById("upgradeUI");

canvas.width = 900;
canvas.height = 600;

/* ========================= */
let score=0, level=1, exp=0;
let gameOver=false, gameClear=false;
let paused=false;

/* =========================
   플레이어
========================= */
class Player{
    constructor(){
        this.width=50; this.height=50;
        this.x=canvas.width/2-25;
        this.y=canvas.height-80;
        this.speed=6;
        this.power=1;
        this.fireRate=250;
        this.lastShot=0;

        this.maxHP=100;
        this.hp=100;

        this.bulletSpread=1; // 1,2,3,5 갈래

        this.shield=false;
        this.shieldCooldown=false;

        this.bombCooldown=false;
    }

    move(dir){
        if(dir==="left" && this.x>0) this.x-=this.speed;
        if(dir==="right" && this.x+this.width<canvas.width) this.x+=this.speed;
    }

    shoot(){
        const now=Date.now();
        if(now-this.lastShot < this.fireRate) return;
        this.lastShot=now;

        const spreads = {
            1:[0],
            2:[-2,2],
            3:[-3,0,3],
            5:[-4,-2,0,2,4]
        };

        spreads[this.bulletSpread].forEach(dx=>{
            bullets.push(new Bullet(this.x+22,this.y,dx));
        });
    }

    activateShield(){
        if(this.shieldCooldown) return;
        this.shield=true;
        this.shieldCooldown=true;
        setTimeout(()=>this.shield=false,3000);
        setTimeout(()=>this.shieldCooldown=false,8000);
    }

    useBomb(){
        if(this.bombCooldown) return;
        enemies.length=0;
        boss=null;
        this.bombCooldown=true;
        setTimeout(()=>this.bombCooldown=false,10000);
    }

    takeDamage(d){
        if(this.shield) return;
        this.hp-=d;
        if(this.hp<=0) gameOver=true;
    }

    draw(){
        ctx.fillStyle=this.shield?"yellow":"cyan";
        ctx.fillRect(this.x,this.y,this.width,this.height);
    }
}

/* ========================= */
class Bullet{
    constructor(x,y,dx){
        this.x=x; this.y=y;
        this.width=6; this.height=15;
        this.speed=8;
        this.dx=dx;
        this.damage=player.power;
    }
    update(){ this.y-=this.speed; this.x+=this.dx; }
    draw(){
        ctx.fillStyle="yellow";
        ctx.fillRect(this.x,this.y,this.width,this.height);
    }
}

/* ========================= */
class Enemy{
    constructor(){
        this.width=40; this.height=40;
        this.x=Math.random()*(canvas.width-40);
        this.y=-40;
        this.hp=2+level;
        this.speed=2+level*0.3;
        this.damage=10;
    }
    update(){ this.y+=this.speed; }
    draw(){
        ctx.fillStyle="red";
        ctx.fillRect(this.x,this.y,this.width,this.height);
    }
}

/* ========================= */
class Boss{
    constructor(){
        this.width=120; this.height=120;
        this.x=canvas.width/2-60;
        this.y=50;
        this.hp=200+level*50;
        this.damage=20;
    }
    update(){
        this.x+=Math.sin(Date.now()/500)*2;
    }
    draw(){
        ctx.fillStyle="purple";
        ctx.fillRect(this.x,this.y,this.width,this.height);

        // HP bar
        ctx.fillStyle="red";
        ctx.fillRect(250,20,400,20);
        ctx.fillStyle="lime";
        ctx.fillRect(250,20,400*(this.hp/(200+level*50)),20);
    }
}

/* ========================= */
const player=new Player();
const bullets=[];
const enemies=[];
let boss=null;

/* ========================= */
const keys={};
window.addEventListener("keydown",e=>{
    keys[e.key]=true;
    if(e.key===" ") player.shoot();
    if(e.key==="q") player.activateShield();
    if(e.key==="e") player.useBomb();
});
window.addEventListener("keyup",e=>keys[e.key]=false);

/* ========================= */
function isColliding(a,b){
    return a.x<b.x+b.width &&
           a.x+a.width>b.x &&
           a.y<b.y+b.height &&
           a.y+a.height>b.y;
}

/* =========================
   레벨업 UI
========================= */
function showUpgrade(){
    paused=true;
    upgradeUI.style.display="block";
    upgradeUI.innerHTML="<h3>능력 선택</h3>";

    const options=[
        {text:"공격력 증가",action:()=>player.power++},
        {text:"연사 속도 증가",action:()=>player.fireRate=Math.max(100,player.fireRate-30)},
        {text:"총알 갈래 증가",action:()=>player.bulletSpread=Math.min(5,player.bulletSpread+1)}
    ];

    options.forEach(opt=>{
        const btn=document.createElement("button");
        btn.innerText=opt.text;
        btn.onclick=()=>{
            opt.action();
            upgradeUI.style.display="none";
            paused=false;
        };
        upgradeUI.appendChild(btn);
    });
}

/* ========================= */
function gainExp(amount){
    exp+=amount;
    if(exp>=level*10){
        exp=0;
        level++;

        if(level===5 || level===10)
            boss=new Boss();
        else
            showUpgrade();

        if(level>10) gameClear=true;
    }
}

/* ========================= */
function update(){
    if(gameOver||gameClear||paused) return;

    if(keys["ArrowLeft"]) player.move("left");
    if(keys["ArrowRight"]) player.move("right");

    bullets.forEach((b,i)=>{
        b.update();
        if(b.y<0) bullets.splice(i,1);
    });

    if(!boss && Math.random()<0.03)
        enemies.push(new Enemy());

    enemies.forEach((e,ei)=>{
        e.update();
        if(isColliding(player,e)){
            player.takeDamage(e.damage);
            enemies.splice(ei,1);
        }

        bullets.forEach((b,bi)=>{
            if(isColliding(b,e)){
                e.hp-=b.damage;
                bullets.splice(bi,1);
                if(e.hp<=0){
                    score+=10;
                    gainExp(5);
                    enemies.splice(ei,1);
                }
            }
        });
    });

    if(boss){
        boss.update();

        bullets.forEach((b,bi)=>{
            if(isColliding(b,boss)){
                boss.hp-=b.damage;
                bullets.splice(bi,1);
                if(boss.hp<=0){
                    boss=null;
                    gainExp(20);
                }
            }
        });

        if(isColliding(player,boss))
            player.takeDamage(boss.damage);
    }
}

/* ========================= */
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    player.draw();
    bullets.forEach(b=>b.draw());
    enemies.forEach(e=>e.draw());
    if(boss) boss.draw();

    ctx.fillStyle="white";
    ctx.fillText("HP: "+player.hp,10,20);
    ctx.fillText("Level: "+level,10,40);
    ctx.fillText("Score: "+score,10,60);

    if(gameOver){
        ctx.font="40px Arial";
        ctx.fillText("GAME OVER",canvas.width/2-120,canvas.height/2);
    }

    if(gameClear){
        ctx.font="40px Arial";
        ctx.fillStyle="gold";
        ctx.fillText("YOU WIN!",canvas.width/2-100,canvas.height/2);
    }
}

/* ========================= */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
