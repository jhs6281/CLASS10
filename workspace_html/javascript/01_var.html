        /*
            여러줄 주석

        */
       console.log(`hello world`);

       // 변수 선언 방법 1
       var a = 10;

       a = "글씨2"
       console.log("a : " + a);

       // 변수 선언 방법 2
       c = 20;
       console.log(`c : ` + c);

       let d = 30;
       console.log(`d : `+ d);

       

       // 변수 선언 방법 4
       const e = 40; // final 과 비슷. 더이상 변수를 바꾸지 않을 것.
       console.log(`e : ` + e);

        d = 100;

        // 실수 방지용

        // e = 50;
        console.log(`e : ` + e); // 오류 (const라서)

        // const f; 선언과 동시에 값을 무조건 줘야한다.
        // let 같은 변수명으로 재선언 불가능하다 (실수 방지) / 기본 사용

        // js 문법
        // ECMA Script 6

        let a1 = "문자"
        let a2 = 3
        console.log(typeof a1)
        console.log(typeof a2)
        
        let b1 = 1.5;
        let b2 = "1.5";
        console.log(b1 == b2);
        console.log(b1 === b2); // 값 + 타입 비교 연산자
        
        console.log(a1*3); // 숫자 아님 (not a number)
        console.log(b2*3); // 문자열 숫자로 자동 변환한 결과값
        console.log(b2-2); // 얜 계산됨
        
        console.log(b2+2); // 문자열 더하기로 우선순위 적용

        /*
            String a = "123";
            int b = Integer.parseInt(a); //123 
        */

        b2 = `1.5`;
        console.log(parseInt(b2)); // 1.5 인트 타입 > 1 
        console.log(Number(b2)-2); // 문자를 숫자로 변환 
        // 헷갈리지 않게 Number 함수 사용을 생활화하자. 

        let c1 = '이것';
        console.log(c1 * 2); // 에러가 아니라 NaN으로 표기됨
        console.log(isNaN(c1*2)) // NaN이면(숫자가 아니라면) true 반환
        
        console.log(5/0); // 무한 계산 -> Infinity 반환 / 에러 아님
        console.log(isFinite(5/0)) // 유한이냐?

        // 리턴 타입 보이드 > 근데 바로 쓸 수 있는 (?)
        alert(`아무거나`) // 경고창
        // 경고창이 떠 있으면 JavaScript가 멈춘다.
        // thread가 1개이기 때문 (단일 스레드)

        let h = 20;
        confirm('컨펌' ); // 확인 / 취소
        // 컨펌 확인: 내용 / 컨펌 취소: break
        console.log('confirm h : ' + h);
        prompt('비밀번호 입력하세요');

        let i = prompt('비번 입력하세요') 
        console.log('prompt i : ' + i)
        console.log('입력한 글씨는 ' + i + "입니다")

        console.log( `입력한 글씨는 ${i}입니다`); // printf %d 문과 비슷함
        // 양식: `문자문자 ${값} 문자문자`  
        console.error("빨강") // 에러 만들기

        let j=1, 
            k='222asf',

        console.log(j, k); //콤마로 출력 추가 가능

    </script>
