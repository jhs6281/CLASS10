<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ethical Choice Simulator - Pro Edition</title>
    <style>
        :root {
            --rail-color: #888;
            --sleeper-color: #4a302a;
            --gravel-color: #222;
            --primary-orange: #d35400;
            --bg-color: #1a1a1a;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-color); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding-top: 40px; }

        /* 🏠 1. 메인 홈 화면 */
        #home-screen { width: 850px; text-align: center; }
        .admin-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .name-box { background: #333; padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #555; }
        .stage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stage-card { background: #252525; padding: 30px 15px; border-radius: 15px; cursor: pointer; border: 2px solid #444; transition: 0.3s; }
        .stage-card:hover:not(.stage-locked) { border-color: var(--primary-orange); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(211, 84, 0, 0.3); }
        .stage-locked { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        .stage-cleared { border-color: #27ae60 !important; position: relative; }
        .stage-cleared::before { content: "✓"; position: absolute; top: 10px; right: 10px; color: #27ae60; font-weight: bold; }

        /* 🎮 2. 게임 플레이 화면 */
        #game-play { display: none; width: 900px; text-align: center; background: #2d2d2d; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
        .stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #stage-area { position: relative; height: 380px; background: var(--gravel-color); margin: 20px 0; border-radius: 12px; overflow: hidden; border: 5px solid #333; }
        
        .rail-track { position: absolute; height: 50px; background-image: linear-gradient(0deg, transparent 20%, var(--rail-color) 20%, var(--rail-color) 26%, transparent 26%, transparent 74%, var(--rail-color) 74%, var(--rail-color) 80%, transparent 80%), linear-gradient(90deg, var(--sleeper-color) 12px, transparent 12px); background-size: 100% 100%, 35px 100%; z-index: 3; }
        .main-line { width: 100%; top: 80px; left: 0; }
        .bottom-line { width: 100%; top: 250px; left: 0; }
        .connector-diagonal { position: absolute; width: 320px; height: 50px; top: 165px; left: 100px; transform: rotate(31deg); z-index: 2; background-image: linear-gradient(0deg, transparent 20%, var(--rail-color) 20%, var(--rail-color) 26%, transparent 26%, transparent 74%, var(--rail-color) 74%, var(--rail-color) 80%, transparent 80%), linear-gradient(90deg, var(--sleeper-color) 12px, transparent 12px); background-size: 100% 100%, 35px 100%; }
        
        #trolley { position: absolute; left: -100px; top: 75px; font-size: 60px; z-index: 10; }
        .victim-group { position: absolute; right: 100px; z-index: 5; transition: 0.5s; text-align: right; }
        .status-icon { position: absolute; font-size: 25px; top: -30px; left: 50%; transform: translateX(-50%); opacity: 0; }

        /* 📊 로그 모달 및 결과창 */
        #log-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .log-window { background: #222; width: 95%; max-width: 850px; max-height: 85vh; border-radius: 20px; border: 1px solid var(--primary-orange); display: flex; flex-direction: column; overflow: hidden; }
        .log-header { background: #333; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .log-tabs { display: flex; background: #2a2a2a; padding: 10px 20px; gap: 10px; border-bottom: 1px solid #444; overflow-x: auto; }
        .tab-btn { background: #444; border: none; color: #ccc; padding: 8px 15px; border-radius: 5px; cursor: pointer; white-space: nowrap; position: relative; }
        .tab-btn.active { background: var(--primary-orange); color: white; }
        
        .log-body { padding: 20px; overflow-y: auto; flex-grow: 1; color: #ddd; }
        .log-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .log-table th { background: #2d2d2d; color: var(--primary-orange); padding: 12px; border-bottom: 2px solid #444; position: relative; }
        .log-table td { padding: 12px; border-bottom: 1px solid #333; }
        .status-v { color: #2ecc71; font-weight: bold; }
        .status-x { color: #e74c3c; font-weight: bold; }

        #final-report { display: none; width: 850px; background: #222; padding: 30px; border-radius: 20px; border: 1px solid #27ae60; }
        .report-item { background: #333; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 5px solid var(--primary-orange); }
        .report-no-choice { border-left: 5px solid #555; opacity: 0.6; }

        .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 8px; color: white; font-weight: bold; }
        .btn-orange { background: var(--primary-orange); }
        .btn-gray { background: #555; }
        .is-hit { filter: grayscale(1); transform: scale(0.8); opacity: 0.5; }

        #next-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #333; padding: 30px; border-radius: 20px; border: 1px solid var(--primary-orange); z-index: 200; text-align: center; }

        @keyframes drive-straight { 0% { left: 20px; } 100% { left: 110%; } }
        @keyframes drive-side { 
            0% { left: 20px; top: 75px; transform: rotate(0deg); }
            20% { left: 110px; top: 75px; transform: rotate(31deg); }
            75% { left: 450px; top: 245px; transform: rotate(0deg); }
            100% { left: 110%; top: 245px; }
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="admin-bar"><button class="btn btn-gray" style="font-size:12px;" onclick="openLog()">📊 관리자 로그</button></div>
        <h1>윤리적 선택 시뮬레이터</h1>
        <div class="name-box">
            <label style="font-weight: bold; font-size: 1.1em;">참여자 성함: </label>
            <input type="text" id="global-name" placeholder="이름을 입력하세요" maxlength="10" 
                   style="padding: 12px; border-radius: 8px; border: 2px solid var(--primary-orange); width: 220px; background: #111; color: white; font-size: 1em;">
            <p style="font-size: 12px; color: #888; margin-top: 10px;">* 미입력 시 랜덤 이름이 부여됩니다. 스테이지 클릭 시 저장이 시작됩니다.</p>
        </div>
        <div class="stage-grid">
            <div class="stage-card" id="card-1-1" onclick="checkAndStart('1-1')"><h3>Stage 1-1</h3><p>수량의 딜레마</p></div>
            <div class="stage-card stage-locked" id="card-1-2" onclick="checkAndStart('1-2')"><h3>Stage 1-2</h3><p>미래의 딜레마</p></div>
            <div class="stage-card stage-locked" id="card-1-3" onclick="checkAndStart('1-3')"><h3>Stage 1-3</h3><p>가치의 딜레마</p></div>
        </div>
    </div>

    <div id="game-play">
        <div class="stage-header">
            <button class="btn btn-gray" onclick="goHome()">◀ 스테이지 목록</button>
            <h2 id="stage-title">Stage 1-1</h2>
            <div style="width:100px;"></div>
        </div>
        <div id="stage-area">
            <div class="rail-track main-line"></div><div class="connector-diagonal"></div><div class="rail-track bottom-line"></div><div id="trolley">🚃</div>
            <div id="victims-top" class="victim-group" style="top: 75px;"><span id="label-top" style="display:block; font-size:12px; color:#ff9f43; font-weight:bold;"></span><span class="status-icon"></span><span id="icons-top" style="font-size:40px;"></span></div>
            <div id="victims-bottom" class="victim-group" style="top: 245px;"><span id="label-bottom" style="display:block; font-size:12px; color:#ff9f43; font-weight:bold;"></span><span class="status-icon"></span><span id="icons-bottom" style="font-size:40px;"></span></div>
        </div>
        <div id="choice-buttons">
            <button class="btn btn-gray" onclick="decide('stay')">가만히 두기</button>
            <button class="btn btn-orange" onclick="decide('switch')">레버 당기기</button>
        </div>
    </div>

    <div id="final-report">
        <h2 style="color:#27ae60;">🏁 최종 선택 보고서</h2>
        <p id="final-user-info" style="font-size: 1.2em; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 10px;"></p>
        <div id="report-list"></div>
        <button class="btn btn-orange" style="margin-top:20px;" onclick="goHome()">스테이지 목록으로</button>
    </div>
    
    <div id="next-modal">
        <h3>결정 완료</h3>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="btn btn-gray" onclick="goHome()">목록으로</button>
            <button id="modal-btn" class="btn btn-orange">다음 단계로 ▶</button>
        </div>
    </div>

    <div id="log-modal">
        <div class="log-window">
            <div class="log-header">
                <h3 style="margin:0; color:var(--primary-orange);">📊 선택 로그 분석</h3>
                <div>
                    <button class="btn btn-gray" style="background:#c0392b; margin-right:10px; font-size:12px;" onclick="resetAllLogs()">⚠️ 데이터 초기화</button>
                    <button class="btn btn-gray" onclick="document.getElementById('log-modal').style.display='none'">닫기</button>
                </div>
            </div>
            <div class="log-tabs">
                <button class="tab-btn active" id="default-tab" onclick="filterLog('1-1', this)">Stage 1-1</button>
                <button class="tab-btn" onclick="filterLog('1-2', this)">Stage 1-2</button>
                <button class="tab-btn" onclick="filterLog('1-3', this)">Stage 1-3</button>
                <button class="tab-btn" style="border:1px solid #27ae60;" onclick="showGlobalSummary(this)">🏆 최종결과 요약</button>
            </div>
            <div class="log-body">
                <div id="summary-legend" style="display:none;" class="legend">💡 <b>V</b>: 레버 당김 | <b>X</b>: 방관</div>
                <table class="log-table"><thead id="log-table-head"></thead><tbody id="log-table-body"></tbody></table>
            </div>
        </div>
    </div>

    <script>
        let currentUserName = "";
        let userStats = {};
        let currentStage = "";
        let isEnded = false;

        const stageData = {
            '1-1': { title: "Stage 1-1", info: "일반인 5명 vs 1명", top: "일반인 5명", bottom: "일반인 1명", iT: "🧍🧍🧍🧍🧍", iB: "🧍", next: "1-2", topCount: 5, bottomCount: 1 },
            '1-2': { title: "Stage 1-2", info: "노인 5명 vs 어린이 1명", top: "노인 5명", bottom: "어린이 1명", iT: "👴👴👴👴👴", iB: "👶", next: "1-3", topCount: 5, bottomCount: 1 },
            '1-3': { title: "Stage 1-3", info: "노숙자 5명 vs 의사 1명", top: "노숙자 5명", bottom: "의사 1명", iT: "👤👤👤👤👤", iB: "🩺", next: "done", topCount: 5, bottomCount: 1 }
        };

        function loadAllData() {
            const data = localStorage.getItem('tr_all_user_stats');
            userStats = data ? JSON.parse(data) : {};
        }

        function saveAllData() {
            localStorage.setItem('tr_all_user_stats', JSON.stringify(userStats));
        }

        // [핵심 변경] 이름을 입력할 때가 아니라, 실제 스테이지를 클릭할 때만 세션 생성
        function checkAndStart(sid) {
            let inputField = document.getElementById('global-name');
            let inputName = inputField.value.trim();
            
            // 이름이 없으면 그제서야 랜덤 아이디 부여
            if (!inputName) {
                inputName = "user" + (Math.floor(Math.random() * 900) + 100);
                inputField.value = inputName;
            }
            
            currentUserName = inputName;

            // 이미 존재하는 유저인지 확인 후 데이터 초기화 (스테이지 클릭 시점에 단 한 번 수행)
            if (!userStats[currentUserName]) {
                userStats[currentUserName] = { choices: {}, unlocked: ['1-1'] };
                saveAllData();
            }

            const userData = userStats[currentUserName];
            if (!userData.unlocked.includes(sid)) {
                alert("이전 단계를 먼저 클리어해야 합니다.");
                return;
            }
            startStage(sid);
        }

        // 이하 기존 로직 유지
        function startStage(sid) {
            currentStage = sid; isEnded = false;
            const data = stageData[sid];
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-play').style.display = 'block';
            document.getElementById('final-report').style.display = 'none';
            document.getElementById('next-modal').style.display = 'none';
            document.getElementById('choice-buttons').style.display = 'block';
            document.getElementById('stage-title').innerText = data.title;
            document.getElementById('label-top').innerText = data.top;
            document.getElementById('label-bottom').innerText = data.bottom;
            document.getElementById('icons-top').innerText = data.iT;
            document.getElementById('icons-bottom').innerText = data.iB;
            
            const t = document.getElementById('trolley');
            t.style.animation = "none"; t.style.left = '-100px'; t.style.top = '75px';
            document.querySelectorAll('.victim-group').forEach(g => { 
                g.classList.remove('is-hit'); 
                g.querySelector('.status-icon').style.opacity = 0; 
            });
        }

        function decide(mode) {
            if (isEnded) return; isEnded = true;
            const data = stageData[currentStage];
            const victim = (mode === 'switch') ? {t: data.bottom, c: data.bottomCount, a: "레버 당김", code: "V"} : {t: data.top, c: data.topCount, a: "방관", code: "X"};
            
            userStats[currentUserName].choices[currentStage] = victim;
            if (data.next !== 'done' && !userStats[currentUserName].unlocked.includes(data.next)) {
                userStats[currentUserName].unlocked.push(data.next);
            }
            saveAllData();

            const trolley = document.getElementById('trolley');
            if (mode === 'switch') { 
                trolley.style.animation = "drive-side 2.8s forwards ease-in-out"; 
                setTimeout(() => showHit('victims-bottom'), 2200); 
            } else { 
                trolley.style.animation = "drive-straight 2.5s forwards linear"; 
                setTimeout(() => showHit('victims-top'), 1600); 
            }
            saveGlobalLog(victim);
        }

        function saveGlobalLog(victim) {
            const logs = JSON.parse(localStorage.getItem(`tr_logs_stage_${currentStage}`) || '[]');
            logs.push({ name: currentUserName, choice: victim.a, victimName: victim.t, date: new Date().toLocaleTimeString() });
            localStorage.setItem(`tr_logs_stage_${currentStage}`, JSON.stringify(logs));

            setTimeout(() => {
                const modal = document.getElementById('next-modal');
                modal.style.display = 'block';
                const btn = document.getElementById('modal-btn');
                if (stageData[currentStage].next !== 'done') {
                    btn.innerText = "다음 단계로 ▶";
                    btn.onclick = () => startStage(stageData[currentStage].next);
                } else {
                    btn.innerText = "최종 결과 보기 🏁";
                    btn.onclick = showFinalReport;
                }
            }, 3000);
        }

        function showFinalReport() {
            document.getElementById('game-play').style.display = 'none';
            document.getElementById('next-modal').style.display = 'none';
            document.getElementById('final-report').style.display = 'block';
            document.getElementById('final-user-info').innerText = `[${currentUserName}] 님의 시뮬레이션 결과`;
            
            let html = ""; let totalVictims = 0;
            const userData = userStats[currentUserName];
            const allUsers = Object.keys(userStats);
            const isFirstUser = allUsers.length <= 1;

            ['1-1', '1-2', '1-3'].forEach(sid => {
                const choice = userData.choices[sid];
                if (choice) {
                    totalVictims += choice.c;
                    let percentage;
                    if (isFirstUser) {
                        percentage = Math.floor(Math.random() * (70 - 40 + 1)) + 40;
                    } else {
                        const logs = JSON.parse(localStorage.getItem(`tr_logs_stage_${sid}`) || '[]');
                        const sameChoiceCount = logs.filter(l => l.choice === choice.a).length;
                        percentage = Math.round((sameChoiceCount / logs.length) * 100);
                    }

                    html += `<div class="report-item">
                                <b>${stageData[sid].title}</b>: ${choice.a} 
                                <span style="color:#ff4d4d; margin-left:10px;">(💀 ${choice.t} 희생)</span>
                                <div style="font-size:12px; color:#aaa; margin-top:5px;">다른 유저의 ${percentage}%가 당신과 같은 선택을 내렸습니다.</div>
                             </div>`;
                } else {
                    html += `<div class="report-item report-no-choice"><b>${stageData[sid].title}</b>: <span style="color:#888;">이 스테이지에서 선택을 내리지 않음</span></div>`;
                }
            });

            html += `<div style="background:#111; padding:20px; border-radius:10px; margin-top:15px; border: 1px solid #27ae60; text-align:center;">총 희생자 수: <b style="color:#ff4d4d;">${totalVictims}명</b></div>`;
            document.getElementById('report-list').innerHTML = html;
        }

        function goHome() {
            document.getElementById('game-play').style.display = 'none';
            document.getElementById('final-report').style.display = 'none';
            document.getElementById('next-modal').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
            updateStageVisuals();
        }

        function updateStageVisuals() {
            const userData = userStats[currentUserName] || { unlocked: ['1-1'], choices: {} };
            ['1-1', '1-2', '1-3'].forEach(sid => {
                const card = document.getElementById(`card-${sid}`);
                if (!card) return;
                card.classList.remove('stage-locked', 'stage-cleared');
                if (userData.unlocked.includes(sid)) {
                    if (userData.choices[sid]) card.classList.add('stage-cleared');
                } else { card.classList.add('stage-locked'); }
            });
        }

        function showHit(id) { 
            const h = document.getElementById(id); 
            h.classList.add('is-hit'); 
            h.querySelector('.status-icon').innerText = "💀"; 
            h.querySelector('.status-icon').style.opacity = 1; 
        }

        function openLog() { if (prompt("암호: 1234") === "1234") { filterLog('1-1', document.getElementById('default-tab')); document.getElementById('log-modal').style.display = 'flex'; } }
        
        function filterLog(sid, btn) {
            updateTab(btn); document.getElementById('summary-legend').style.display = 'none';
            document.getElementById('log-table-head').innerHTML = `<tr><th>이름</th><th>결정</th><th>희생자 정보</th><th>시간</th></tr>`;
            const tbody = document.getElementById('log-table-body'); tbody.innerHTML = "";
            const logs = JSON.parse(localStorage.getItem(`tr_logs_stage_${sid}`) || '[]');
            logs.reverse().forEach(l => {
                tbody.innerHTML += `<tr><td>${l.name}</td><td>${l.choice}</td><td style="color:#ff4d4d;">💀 ${l.victimName}</td><td>${l.date}</td></tr>`;
            });
        }

        // [요청 사항 반영] 최종결과 요약에 마우스 오버 툴팁 및 총 희생자 합계 추가
        function showGlobalSummary(btn) {
            updateTab(btn); 
            document.getElementById('summary-legend').style.display = 'inline-block';
            document.getElementById('log-table-head').innerHTML = `<tr><th>참여자</th><th>1-1</th><th>1-2</th><th>1-3</th><th>총 희생자</th></tr>`;
            const tbody = document.getElementById('log-table-body'); 
            tbody.innerHTML = "";
            
            Object.keys(userStats).reverse().forEach(name => {
                const u = userStats[name];
                let totalVictims = 0;

                const stages = ['1-1', '1-2', '1-3'];
                const cells = stages.map(sid => {
                    const choice = u.choices[sid];
                    if (choice) {
                        totalVictims += choice.c;
                        // title 속성으로 마우스 오버 시 정보 표시
                        return `<td title="${stageData[sid].info}"><span class="${choice.code==='V'?'status-v':'status-x'}">${choice.code}</span></td>`;
                    }
                    return `<td>-</td>`;
                });

                tbody.innerHTML += `<tr>
                    <td style="font-weight:bold;">${name}</td>
                    ${cells.join('')}
                    <td style="color:#ff4d4d; font-weight:bold;">${totalVictims}명</td>
                </tr>`;
            });
        }

        function updateTab(btn) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        
        function resetAllLogs() {
            if (confirm("정말로 모든 유저 데이터와 로그를 삭제하시겠습니까?")) {
                localStorage.clear();
                userStats = {};
                alert("초기화되었습니다.");
                location.reload();
            }
        }

        loadAllData();
        updateStageVisuals();
    </script>
</body>
</html>
